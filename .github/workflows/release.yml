name: Release

# Push a tag like v1.0.0 to build the package on macOS and Linux, run the tests and publish a GitHub release with both packages attached.
# Nothing here runs unless someone pushes a tag. This workflow has not been run yet (see docs/RELEASE-1.0.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Tests
        run: |
          cargo test --release --workspace
          cargo build --release -p cartographer-cli
          node --test panel/test/*.test.mjs scripts/test/*.test.mjs
          node scripts/standards.mjs check
      - name: Package
        run: node scripts/package.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/*.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Cartographer $GITHUB_REF_NAME" --notes "See CHANGELOG.md." dist/*.tar.gz dist/SHA256SUMS
